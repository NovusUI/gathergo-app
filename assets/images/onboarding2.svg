<svg xmlns="http://www.w3.org/2000/svg" width="300" height="315" viewBox="0 0 300 315" fill="none" role="img" aria-labelledby="t d">
<title id="t">GO together: carpooling with Gogo</title><desc id="d">Gogo drives a coral car carrying two friends along a dotted route to an event pin. The middle friend waves a ticket, the friend in the back seat holds a heart up to its face, the driver keeps a hand on the wheel, and a seat counter shows three seats taken and one still open.</desc>
<style>
.fb{transform-box:fill-box;transform-origin:center}
.vb{transform-box:view-box}
.tw{animation:tw 2.4s ease-in-out infinite}.tw2{animation-delay:-.8s}.tw3{animation-delay:-1.6s}
.bob{animation:bob 2.4s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s linear infinite}
.e2{animation-delay:-1.7s}.e3{animation-delay:-3s}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(20deg);opacity:.6}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}}

.carbob{animation:carbob .35s ease-in-out infinite alternate}
.wave{transform-origin:172px 128px;animation:wave .7s ease-in-out infinite alternate}
.route{stroke-dasharray:2 8;animation:route 1.2s linear infinite}
.pin{animation:pin 1.4s ease-in-out infinite}
.beat{animation:beat 1s ease-in-out infinite}
.seat{animation:seat 1.2s ease-in-out infinite}
.whA{transform-origin:84px 212px;animation:spin .5s linear infinite}
.whB{transform-origin:218px 212px;animation:spin .5s linear infinite}
.spd{animation:spd .7s linear infinite}.s2{animation-delay:-.23s}.s3{animation-delay:-.46s}
.road{stroke-dasharray:14 12;animation:road .4s linear infinite}
@keyframes carbob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes route{to{stroke-dashoffset:-20}}
@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes seat{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spd{0%{transform:translateX(14px);opacity:0}30%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
@keyframes road{to{stroke-dashoffset:-26}}
</style>
