<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -70 480 420" width="480" height="420" role="img" aria-labelledby="t d">
  <title id="t">Gogo driving toward you, frenzy level 4: inferno</title>
  <desc id="d">Front view: Gogo, on fire with excitement and star-eyed, charges at you in a roadster with burning tires, a glowing aura and embers flying everywhere.</desc>
  <defs>
    <radialGradient id="h4-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FF5A36" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .g-aura { transform-origin: 200px 160px; animation: g-aura 0.8s ease-in-out infinite; }
    .g-rays { transform-origin: 200px 190px; animation: g-rays 0.45s linear infinite; }
    .g-r2 { animation-delay: -.22s; }
    .g-zoom { transform-origin: 200px 330px; animation: g-zoom 0.5s ease-in-out infinite; }
    .g-car { animation: g-car 0.22s ease-in-out infinite alternate; }
    .g-shake { animation: g-shake 0.16s linear infinite; }
    .g-gogo { transform-origin: 200px 200px; animation: g-hop 0.5s ease-in-out infinite; }
    .g-flame { transform-origin: 20px 56px; animation: g-flick 0.45s ease-in-out infinite; }
    .g-side { transform-origin: 20px 56px; animation: g-flick 0.37s ease-in-out infinite; }
    .g-tf { transform-origin: 20px 56px; animation: g-flick 0.3s ease-in-out infinite; }
    .g-star { transform-box: fill-box; transform-origin: center; animation: g-star 0.5s ease-in-out infinite; }
    .g-armL { transform-origin: 28px 124px; animation: g-armL 0.5s ease-in-out infinite; }
    .g-armR { transform-origin: 172px 124px; animation: g-armR 0.5s ease-in-out infinite; }
    .g-tread { animation: g-tread 0.2s linear infinite; }
    .g-glow { animation: g-glow 0.4s ease-in-out infinite alternate; }
    .g-ember { animation: g-rise 1.2s linear infinite; }
    .g-m2 { animation-delay: -.2s; } .g-m3 { animation-delay: -.4s; } .g-m4 { animation-delay: -.6s; } .g-m5 { animation-delay: -.8s; } .g-m6 { animation-delay: -1s; }
    @keyframes g-aura { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.1); opacity: 1; } }
    @keyframes g-rays { 0% { transform: scale(.75); opacity: 1; } 100% { transform: scale(1.45); opacity: 0; } }
    @keyframes g-zoom { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes g-car { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes g-shake { 0% { transform: translate(0,0); } 25% { transform: translate(1.4px,-.8px); } 50% { transform: translate(-1.4px,.8px); } 75% { transform: translate(.8px,1.2px); } 100% { transform: translate(0,0); } }
    @keyframes g-hop { 0%,100% { transform: translateY(0) scale(1.05,.95); } 45% { transform: translateY(-10px) scale(.97,1.04); } 70% { transform: translateY(-2px) scale(1,1); } }
    @keyframes g-flick { 0%,100% { transform: scale(1,1) skewX(0); } 25% { transform: scale(.88,1.18) skewX(-6deg); } 55% { transform: scale(1.1,.9) skewX(5deg); } 80% { transform: scale(.94,1.1) skewX(-3deg); } }
    @keyframes g-star { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.22) rotate(12deg); } }
    @keyframes g-armL { 0%,100% { transform: rotate(10deg); } 45% { transform: rotate(-16deg); } }
    @keyframes g-armR { 0%,100% { transform: rotate(-10deg); } 45% { transform: rotate(16deg); } }
    @keyframes g-tread { to { stroke-dashoffset: -16; } }
    @keyframes g-glow { from { opacity: .35; } to { opacity: .7; } }
    @keyframes g-rise { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(0,-60px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .g-aura,.g-rays,.g-zoom,.g-car,.g-shake,.g-gogo,.g-flame,.g-side,.g-tf,.g-star,.g-armL,.g-armR,.g-tread,.g-glow,.g-ember { animation: none; } }
  </style>

