  <title id="t">GatherGo startup animation</title>
  <desc id="d">The three rings of the GatherGo logo draw in and hop, then transform into Gogo: two rings become eyes, the third jumps up to become the antenna, and the logo smiles merge into Gogo's smile. Gogo pops out and waves hello.</desc>
