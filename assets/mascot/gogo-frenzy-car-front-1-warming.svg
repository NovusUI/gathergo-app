    <path d="M160 262Q200 288 240 262" fill="none" stroke="#0B3B35" stroke-width="8" stroke-linecap="round"/>
    <rect x="84" y="284" width="232" height="16" rx="8" fill="#D93A5C"/>
    <rect x="172" y="286" width="56" height="12" rx="4" fill="#FFD84D"/>
