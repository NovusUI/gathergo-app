<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -70 480 420" width="480" height="420" role="img" aria-labelledby="t d">
  <title id="t">Gogo driving toward you, frenzy level 1: warming</title>
  <desc id="d">Front view: Gogo cruises toward you in a coral roadster, glancing up at a small flame on its antenna ring.</desc>
  <style>
    .g-rays { transform-origin: 200px 190px; animation: g-rays 1.8s linear infinite; }
    .g-zoom { transform-origin: 200px 330px; animation: g-zoom 1.8s ease-in-out infinite; }
    .g-car { animation: g-car 0.9s ease-in-out infinite alternate; }
    .g-gogo { animation: g-bob 1.8s ease-in-out infinite; }
    .g-flame { transform-origin: 20px 56px; animation: g-flick 1.6s ease-in-out infinite; }
    .g-eyes { transform-origin: 100px 96px; animation: g-blink 4.6s infinite; }
    .g-tread { animation: g-tread 1.1s linear infinite; }
    .g-glow { animation: g-glow 1.2s ease-in-out infinite alternate; }
    @keyframes g-rays { 0% { transform: scale(.8); opacity: .5; } 100% { transform: scale(1.3); opacity: 0; } }
    @keyframes g-zoom { 0%,100% { transform: scale(1); } 50% { transform: scale(1.012); } }
    @keyframes g-car { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
    @keyframes g-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes g-flick { 0%,100% { transform: scale(1,1) skewX(0); } 30% { transform: scale(.95,1.07) skewX(-3deg); } 65% { transform: scale(1.04,.96) skewX(2deg); } }
    @keyframes g-blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    @keyframes g-tread { to { stroke-dashoffset: -16; } }
    @keyframes g-glow { from { opacity: .15; } to { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .g-rays,.g-zoom,.g-car,.g-gogo,.g-flame,.g-eyes,.g-tread,.g-glow { animation: none; } }
  </style>

  <g stroke="#0FB898" stroke-width="5" stroke-linecap="round">
    <g class="g-rays">
      <line x1="350" y1="190" x2="390" y2="190"/><line x1="330" y1="265" x2="364.5" y2="285"/><line x1="275" y1="320" x2="295" y2="354.5"/><line x1="125" y1="320" x2="105" y2="354.5"/><line x1="70" y1="265" x2="35.5" y2="285"/><line x1="50" y1="190" x2="10" y2="190"/><line x1="70" y1="115" x2="35.5" y2="95"/><line x1="125" y1="60" x2="105" y2="25.5"/><line x1="200" y1="40" x2="200" y2="0"/><line x1="275" y1="60" x2="295" y2="25.5"/><line x1="330" y1="115" x2="364.5" y2="95"/>
    </g>
  </g>

  <ellipse cx="200" cy="332" rx="160" ry="14" fill="#0B3B35" opacity="0.14"/>

  <g class="g-zoom"><g class="g-car">
    <g class="g-gogo">
      <g transform="translate(128 60) scale(0.72)">
        <g transform="translate(100 9) scale(0.55) translate(-20 -56)">
          <g class="g-flame">
