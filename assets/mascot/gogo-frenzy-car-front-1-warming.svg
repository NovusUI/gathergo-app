        </g>
        <path d="M100 23V36" stroke="#0FB898" stroke-width="5" stroke-linecap="round"/>
        <circle cx="100" cy="14" r="9" fill="none" stroke="#0FB898" stroke-width="5"/>
        <rect x="26" y="34" width="148" height="164" rx="74" fill="#1EEBC8"/>
        <circle cx="44" cy="136" r="8" fill="#FF8F7E" opacity="0.6"/>
        <circle cx="156" cy="136" r="8" fill="#FF8F7E" opacity="0.6"/>
        <g class="g-eyes">
          <circle cx="70" cy="96" r="25" fill="#fff"/>
          <circle cx="130" cy="96" r="25" fill="#fff"/>
          <circle cx="74" cy="86" r="11" fill="#0B3B35"/>
          <circle cx="134" cy="86" r="11" fill="#0B3B35"/>
          <circle cx="78" cy="81" r="3.5" fill="#fff"/>
          <circle cx="138" cy="81" r="3.5" fill="#fff"/>
        </g>
        <path d="M74 140Q100 164 126 140" fill="none" stroke="#0B3B35" stroke-width="8" stroke-linecap="round"/>
        <path d="M28 128Q8 140 14 160" fill="none" stroke="#0FB898" stroke-width="12" stroke-linecap="round"/>
        <path d="M172 128Q192 140 186 160" fill="none" stroke="#0FB898" stroke-width="12" stroke-linecap="round"/>
