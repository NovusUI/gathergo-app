<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -100 260 320" width="390" height="480" role="img" aria-labelledby="t d">
  <title id="t">Gogo, frenzy level 2: heating up</title>
  <desc id="d">Gogo's eyes go wide and its cheeks flush as a medium flame dances on the antenna ring.</desc>
  <style>
    .b2-shadow { transform-origin: 100px 207px; animation: b2-shadow 1.5s ease-in-out infinite; }
    .b2-bob { transform-origin: 100px 200px; animation: b2-bob 1.5s ease-in-out infinite; }
    .b2-flame { transform-origin: 20px 56px; animation: b2-flick 0.9s ease-in-out infinite; }
    .b2-armL { transform-origin: 28px 126px; animation: b2-armL 1.5s ease-in-out infinite; }
    .b2-armR { transform-origin: 172px 126px; animation: b2-armR 1.5s ease-in-out infinite; }
    .b2-ember { animation: b2-rise 2.2s linear infinite; }
    .b2-e2 { animation-delay: -1.1s; }
    @keyframes b2-bob { 0%,100% { transform: translateY(0) scale(1.02,.98); } 50% { transform: translateY(-6px) scale(.99,1.01); } }
    @keyframes b2-shadow { 0%,100% { transform: scale(1); } 50% { transform: scale(.88); } }
    @keyframes b2-flick { 0%,100% { transform: scale(1,1) skewX(0); } 25% { transform: scale(.93,1.1) skewX(-4deg); } 55% { transform: scale(1.06,.94) skewX(3deg); } 80% { transform: scale(.97,1.06) skewX(-2deg); } }
    @keyframes b2-armL { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-6deg); } }
    @keyframes b2-armR { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    @keyframes b2-rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-34px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .b2-shadow,.b2-bob,.b2-flame,.b2-armL,.b2-armR,.b2-ember { animation: none; } }
  </style>
  <ellipse class="b2-shadow" cx="100" cy="207" rx="50" ry="7" fill="#0B3B35" opacity="0.1"/>
  <g class="b2-bob">
    <ellipse cx="76" cy="199" rx="16" ry="9" fill="#0FB898"/>
    <ellipse cx="124" cy="199" rx="16" ry="9" fill="#0FB898"/>
    <g transform="translate(100 9) scale(0.92) translate(-20 -56)">
      <g class="b2-flame">
        <path d="M20 0C23 13 38 21 38 38C38 49 30 56 20 56C10 56 2 49 2 38C2 29 7 23 11 16C13 22 15 25 18 26C16 17 17 8 20 0Z" fill="#FF8A2B"/>
        <path d="M20 18C22 27 31 32 31 42C31 49 26 54 20 54C14 54 9 49 9 42C9 36 12 32 15 28C16 32 17 34 19 34C18 28 18 23 20 18Z" fill="#FFC93C"/>
        <path d="M20 34C21 39 25 41 25 46C25 50 23 53 20 53C17 53 15 50 15 46C15 42 18 41 18 38C19 38 19 36 20 34Z" fill="#FFF1B8"/>
      </g>
    </g>
    <circle class="b2-ember" cx="82" cy="-14" r="2.5" fill="#FFC93C"/>
    <circle class="b2-ember b2-e2" cx="120" cy="-10" r="2" fill="#FF8A2B"/>
    <path d="M100 23V36" stroke="#0FB898" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="14" r="9" fill="none" stroke="#0FB898" stroke-width="5"/>
    <rect x="26" y="34" width="148" height="164" rx="74" fill="#1EEBC8"/>
    <circle cx="44" cy="136" r="9" fill="#FF6B5E" opacity="0.75"/>
    <circle cx="156" cy="136" r="9" fill="#FF6B5E" opacity="0.75"/>
    <circle cx="70" cy="96" r="26" fill="#fff"/>
    <circle cx="130" cy="96" r="26" fill="#fff"/>
    <circle cx="71" cy="97" r="9" fill="#0B3B35"/>
    <circle cx="131" cy="97" r="9" fill="#0B3B35"/>
    <circle cx="74" cy="93" r="3" fill="#fff"/>
    <circle cx="134" cy="93" r="3" fill="#fff"/>
    <path d="M80 138Q100 164 120 138Z" fill="#0B3B35" stroke="#0B3B35" stroke-width="6" stroke-linejoin="round"/>
    <g class="b2-armL"><path d="M28 126Q4 120 6 94" fill="none" stroke="#0FB898" stroke-width="12" stroke-linecap="round"/><circle cx="6" cy="89" r="10" fill="#0FB898"/></g>
    <g class="b2-armR"><path d="M172 126Q196 120 194 94" fill="none" stroke="#0FB898" stroke-width="12" stroke-linecap="round"/><circle cx="194" cy="89" r="10" fill="#0FB898"/></g>
  </g>
</svg>
