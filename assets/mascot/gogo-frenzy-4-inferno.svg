<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -100 260 320" width="390" height="480" role="img" aria-labelledby="t d">
  <title id="t">Gogo, frenzy level 4: inferno</title>
  <desc id="d">Gogo is on fire with excitement: star-shaped eyes, a huge layered flame, a glowing aura, flames on its head and embers flying up.</desc>
  <defs>
    <radialGradient id="d4-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#FF5A36" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .d4-aura { transform-origin: 100px 60px; animation: d4-aura 0.8s ease-in-out infinite; }
    .d4-shadow { transform-origin: 100px 207px; animation: d4-shadow 0.55s ease-in-out infinite; }
    .d4-shake { animation: d4-shake 0.18s linear infinite; }
    .d4-hop { transform-origin: 100px 200px; animation: d4-hop 0.55s ease-in-out infinite; }
    .d4-flame { transform-origin: 20px 56px; animation: d4-flick 0.45s ease-in-out infinite; }
    .d4-side { transform-origin: 20px 56px; animation: d4-flick 0.37s ease-in-out infinite; }
    .d4-star { transform-box: fill-box; transform-origin: center; animation: d4-star 0.55s ease-in-out infinite; }
    .d4-armL { transform-origin: 28px 124px; animation: d4-armL 0.55s ease-in-out infinite; }
    .d4-armR { transform-origin: 172px 124px; animation: d4-armR 0.55s ease-in-out infinite; }
    .d4-ember { animation: d4-rise 1.3s linear infinite; }
    .d4-e2 { animation-delay: -.2s; } .d4-e3 { animation-delay: -.45s; } .d4-e4 { animation-delay: -.7s; } .d4-e5 { animation-delay: -.95s; } .d4-e6 { animation-delay: -1.15s; }
    @keyframes d4-aura { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes d4-shake { 0% { transform: translate(0,0); } 25% { transform: translate(1.6px,-1px); } 50% { transform: translate(-1.4px,1px); } 75% { transform: translate(1px,1.2px); } 100% { transform: translate(0,0); } }
    @keyframes d4-hop { 0%,100% { transform: translateY(0) scale(1.06,.94); } 45% { transform: translateY(-16px) scale(.96,1.05); } 70% { transform: translateY(-4px) scale(1,1); } }
    @keyframes d4-shadow { 0%,100% { transform: scale(1); opacity: .14; } 45% { transform: scale(.68); opacity: .06; } }
    @keyframes d4-flick { 0%,100% { transform: scale(1,1) skewX(0); } 25% { transform: scale(.88,1.18) skewX(-6deg); } 55% { transform: scale(1.1,.9) skewX(5deg); } 80% { transform: scale(.94,1.1) skewX(-3deg); } }
    @keyframes d4-star { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.22) rotate(12deg); } }
    @keyframes d4-armL { 0%,100% { transform: rotate(10deg); } 45% { transform: rotate(-16deg); } }
    @keyframes d4-armR { 0%,100% { transform: rotate(-10deg); } 45% { transform: rotate(16deg); } }
    @keyframes d4-rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(-62px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .d4-aura,.d4-shadow,.d4-shake,.d4-hop,.d4-flame,.d4-side,.d4-star,.d4-armL,.d4-armR,.d4-ember { animation: none; } }
  </style>
  <ellipse class="d4-aura" cx="100" cy="60" rx="130" ry="150" fill="url(#d4-aura)"/>
