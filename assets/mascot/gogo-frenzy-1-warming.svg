<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -100 260 320" width="390" height="480" role="img" aria-labelledby="t d">
  <title id="t">Gogo, frenzy level 1: warming up</title>
  <desc id="d">Gogo glances up at a small flame on its antenna ring. The feed is just starting to heat up.</desc>
  <style>
    .a1-shadow { transform-origin: 100px 207px; animation: a1-shadow 3s ease-in-out infinite; }
    .a1-bob { animation: a1-bob 3s ease-in-out infinite; }
    .a1-flame { transform-origin: 20px 56px; animation: a1-flick 1.6s ease-in-out infinite; }
    .a1-eyes { transform-origin: 100px 96px; animation: a1-blink 4.6s infinite; }
    @keyframes a1-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes a1-shadow { 0%,100% { transform: scale(1); } 50% { transform: scale(.94); } }
    @keyframes a1-flick { 0%,100% { transform: scale(1,1) skewX(0); } 30% { transform: scale(.95,1.07) skewX(-3deg); } 65% { transform: scale(1.04,.96) skewX(2deg); } }
    @keyframes a1-blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { .a1-shadow,.a1-bob,.a1-flame,.a1-eyes { animation: none; } }
  </style>
  <ellipse class="a1-shadow" cx="100" cy="207" rx="50" ry="7" fill="#0B3B35" opacity="0.1"/>
  <g class="a1-bob">
    <ellipse cx="76" cy="199" rx="16" ry="9" fill="#0FB898"/>
    <ellipse cx="124" cy="199" rx="16" ry="9" fill="#0FB898"/>
    <g transform="translate(100 9) scale(0.55) translate(-20 -56)">
      <g class="a1-flame">
        <path d="M20 0C23 13 38 21 38 38C38 49 30 56 20 56C10 56 2 49 2 38C2 29 7 23 11 16C13 22 15 25 18 26C16 17 17 8 20 0Z" fill="#FFB02E"/>
        <path d="M20 18C22 27 31 32 31 42C31 49 26 54 20 54C14 54 9 49 9 42C9 36 12 32 15 28C16 32 17 34 19 34C18 28 18 23 20 18Z" fill="#FFE066"/>
        <path d="M20 34C21 39 25 41 25 46C25 50 23 53 20 53C17 53 15 50 15 46C15 42 18 41 18 38C19 38 19 36 20 34Z" fill="#FFF8D6"/>
      </g>
    </g>
    <path d="M100 23V36" stroke="#0FB898" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="14" r="9" fill="none" stroke="#0FB898" stroke-width="5"/>
    <rect x="26" y="34" width="148" height="164" rx="74" fill="#1EEBC8"/>
    <circle cx="44" cy="136" r="8" fill="#FF8F7E" opacity="0.6"/>
    <circle cx="156" cy="136" r="8" fill="#FF8F7E" opacity="0.6"/>
    <g class="a1-eyes">
      <circle cx="70" cy="96" r="25" fill="#fff"/>
      <circle cx="130" cy="96" r="25" fill="#fff"/>
      <circle cx="74" cy="86" r="11" fill="#0B3B35"/>
      <circle cx="134" cy="86" r="11" fill="#0B3B35"/>
      <circle cx="78" cy="81" r="3.5" fill="#fff"/>
      <circle cx="138" cy="81" r="3.5" fill="#fff"/>
    </g>
    <path d="M74 140Q100 164 126 140" fill="none" stroke="#0B3B35" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 128Q8 140 14 160" fill="none" stroke="#0FB898" stroke-width="12" stroke-linecap="round"/>
    <path d="M172 128Q192 140 186 160" fill="none" stroke="#0FB898" stroke-width="12" stroke-linecap="round"/>
