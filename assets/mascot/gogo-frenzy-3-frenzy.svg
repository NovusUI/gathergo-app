<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -100 260 320" width="390" height="480" role="img" aria-labelledby="t d">
  <title id="t">Gogo, frenzy level 3: frenzy</title>
  <desc id="d">Gogo hops with both arms up, mouth wide open, a tall flame on its antenna and small flames on its head.</desc>
  <style>
    .c3-shadow { transform-origin: 100px 207px; animation: c3-shadow 0.7s ease-in-out infinite; }
    .c3-hop { transform-origin: 100px 200px; animation: c3-hop 0.7s ease-in-out infinite; }
    .c3-flame { transform-origin: 20px 56px; animation: c3-flick 0.6s ease-in-out infinite; }
    .c3-side { transform-origin: 20px 56px; animation: c3-flick 0.5s ease-in-out infinite; }
    .c3-armL { transform-origin: 28px 124px; animation: c3-armL 0.7s ease-in-out infinite; }
    .c3-armR { transform-origin: 172px 124px; animation: c3-armR 0.7s ease-in-out infinite; }
    .c3-ember { animation: c3-rise 1.6s linear infinite; }
    .c3-e2 { animation-delay: -.5s; } .c3-e3 { animation-delay: -1.1s; }
    @keyframes c3-hop { 0%,100% { transform: translateY(0) scale(1.05,.95); } 45% { transform: translateY(-12px) scale(.97,1.04); } 70% { transform: translateY(-3px) scale(1,1); } }
    @keyframes c3-shadow { 0%,100% { transform: scale(1); opacity: .12; } 45% { transform: scale(.75); opacity: .06; } }
    @keyframes c3-flick { 0%,100% { transform: scale(1,1) skewX(0); } 25% { transform: scale(.9,1.14) skewX(-5deg); } 55% { transform: scale(1.08,.92) skewX(4deg); } 80% { transform: scale(.95,1.08) skewX(-3deg); } }
    @keyframes c3-armL { 0%,100% { transform: rotate(8deg); } 45% { transform: rotate(-12deg); } }
    @keyframes c3-armR { 0%,100% { transform: rotate(-8deg); } 45% { transform: rotate(12deg); } }
    @keyframes c3-rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .c3-shadow,.c3-hop,.c3-flame,.c3-side,.c3-armL,.c3-armR,.c3-ember { animation: none; } }
  </style>
  <ellipse class="c3-shadow" cx="100" cy="207" rx="50" ry="7" fill="#0B3B35" opacity="0.12"/>
